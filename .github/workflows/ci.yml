name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/billing_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/billing_test
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
      AUTH0_AUDIENCE: https://kalika-billing-api
      AUTH0_ISSUER_BASE_URL: https://dev-el261mjk5znyjcrw.us.auth0.com/
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      REACT_APP_API_BASE_URL: http://localhost:5000
      REACT_APP_AUTH0_DOMAIN: dev-el261mjk5znyjcrw.us.auth0.com
      REACT_APP_AUTH0_CLIENT_ID: XIySZrShLjWSjiA44eT7NSqwm5O27exQ
      REACT_APP_AUTH0_AUDIENCE: https://kalika-billing-api
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
