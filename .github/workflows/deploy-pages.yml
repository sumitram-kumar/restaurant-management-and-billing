name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "client/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      # Set once the backend is deployed: repo Settings > Secrets and
      # variables > Actions > Variables > New repository variable.
      REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
      REACT_APP_AUTH0_DOMAIN: dev-e7c1h1ql5eh1r7w8.us.auth0.com
      REACT_APP_AUTH0_CLIENT_ID: ENc2HGlyRcst2D3A344TaXFVU00N3pv5
      REACT_APP_AUTH0_AUDIENCE: restaurant-management-and-billing-api
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
